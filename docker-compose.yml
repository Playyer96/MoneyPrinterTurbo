x-common-volumes: &common-volumes
  - ./:/MoneyPrinterTurbo

# Everything runs in Docker. Five services on a private bridge network:
# webui and api reach voicestudio (TTS), lightpanda (headless browser) and
# searxng (meta search) by service name, so this works identically on
# Linux, macOS and Windows.
#
#   docker compose up -d --build      start (and rebuild if sources changed)
#   docker compose restart            restart without rebuilding
#   docker compose down               stop and remove
#
# GPU selection is automatic at runtime: the TTS server picks cuda -> mps ->
# cpu and whisper is set to "auto", so the same image uses whatever the
# container can actually see. Nothing to configure for NVIDIA or CPU.
#
# A GPU needs one extra file layered on top, because Docker refuses to start
# when asked for a device driver the host lacks -- it cannot be probed for, so
# the reservations cannot sit in this file and be ignored when absent:
#   NVIDIA: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#   AMD:    docker compose -f docker-compose.yml -f docker-compose.rocm.yml up -d
#   Apple:  docker compose -f docker-compose.yml -f docker-compose.mac.yml up -d
#
# You should not have to know which of those you are. Picking one is automatic:
#   Linux/macOS:  make up
#   Windows:      powershell -ExecutionPolicy Bypass -File docker\up.ps1
# Both ask docker/detect-stack.sh (or its PowerShell twin) whether this host is
# a Mac, has the NVIDIA container runtime, or has an AMD /dev/kfd, and layer in
# the matching override. Setting COMPOSE_FILE yourself overrides the guess.
#
# Windows specifics: Docker Desktop on the WSL2 backend, and for CUDA an NVIDIA
# driver installed on Windows itself, not inside WSL. Keep the clone on the
# WSL2 filesystem or a drive shared with Docker Desktop -- the bind mount below
# is the repo, and a non-shared path silently mounts empty.
#
# Apple Silicon is the odd one out. macOS does not pass Metal through to
# Docker's Linux VM, so no container on a Mac can reach the GPU -- the mac
# override therefore runs the model server on the host (auto-started by a
# LaunchAgent, see docker-compose.mac.yml) and points the app at it.
networks:
  mpt-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.85.0/24

# Named volumes keep the downloaded models, voice profiles and generated
# audio across container restarts and re-creates, and stop the bind-mounted
# MoneyPrinterTurbo source dir from accumulating voice_studio state inside
# the repo. Model weights live here rather than in the image or the repo.
volumes:
  voicestudio_models:
  voicestudio_profiles:
  voicestudio_output:

# Package sources for the app image. "auto" measures which side of the world
# this build is on (docker/pick-mirror.py) instead of hardcoding the China
# mirrors for everyone -- from outside China those were the slow path, since
# the official index was only reached after both mirrors timed out. Force it
# with DOCKER_BUILD_MIRROR=china|default in .env or the environment.
x-build-args: &build-args
  DOCKER_BUILD_MIRROR: "${DOCKER_BUILD_MIRROR:-auto}"
  PIP_USE_OFFICIAL: "${PIP_USE_OFFICIAL:-auto}"

x-service-env: &service-env
  # MoviePy defaults to the imageio-ffmpeg bundled binary (a static ffmpeg
  # 7.0.2 build), which has no NVENC encoder at all, while the app itself
  # resolves /usr/bin/ffmpeg for concat/probes. Point MoviePy at the same
  # binary so the hardware-codec smoke test reflects what actually encodes.
  FFMPEG_BINARY: "${FFMPEG_BINARY:-/usr/bin/ffmpeg}"
  # Service name on the bridge network by default. docker-compose.mac.yml
  # repoints this at the host, where the GPU actually is on Apple Silicon.
  VOICESTUDIO_BASE_URL: "${VOICESTUDIO_BASE_URL:-http://voicestudio:8780}"
  # Topic research talks to two more containers on the same bridge: a headless
  # browser that renders article pages, and a meta search engine that is not
  # rate-limited the way scraping DuckDuckGo directly is.
  LIGHTPANDA_URL: "${LIGHTPANDA_URL:-ws://lightpanda:9222}"
  WEB_SEARCH_PROVIDER: "${WEB_SEARCH_PROVIDER:-searxng}"
  SEARXNG_URL: "${SEARXNG_URL:-http://searxng:8080}"

services:
  voicestudio:
    # OmniVoice lives in its own image so the app image does not carry
    # torch/transformers. PYTORCH_INDEX_URL selects the CPU, CUDA or ROCm
    # wheels; the GPU override files set it.
    build:
      context: ./vendor/voice_studio
      dockerfile: Dockerfile
      args:
        # Empty = default PyPI torch, which auto-uses an NVIDIA GPU when one
        # is attached and the CPU when none is. Only ROCm needs an override.
        PYTORCH_INDEX_URL: "${PYTORCH_INDEX_URL:-}"
    image: voicestudio:latest
    container_name: "moneyprinterturbo-voicestudio"
    networks:
      - mpt-net
    environment:
      # server.py reads these; matches the defaults in the Dockerfile.
      VOICESTUDIO_HOST: "0.0.0.0"
      VOICESTUDIO_PORT: "8780"
      HF_HOME: "/voicestudio/models"
      HF_HUB_DISABLE_XET: "1"
    ports:
      # Host-side port mapping is optional; mainly for ad-hoc curl from the
      # host. Inter-container traffic goes over the mpt-net bridge and never
      # touches this mapping.
      - "127.0.0.1:8780:8780"
    volumes:
      - voicestudio_models:/voicestudio/models
      - voicestudio_profiles:/voicestudio/voice_profiles
      - voicestudio_output:/voicestudio/output
    restart: unless-stopped
    # VoiceStudio loads a ~5GB OmniVoice stack on first request. Give the
    # container enough memory headroom; bump up if OOMs on a small host.
    deploy:
      resources:
        limits:
          memory: 8G

  lightpanda:
    # Headless browser for topic research. ~10MB, no Chrome and no Node: it
    # renders the page and returns the DOM over CDP, so JavaScript-only news
    # and trend pages produce real text instead of an empty shell.
    #
    # --obey-robots is deliberate. Research reads other people's sites; a
    # renderer that ignores robots.txt is how a project gets its IP banned.
    image: lightpanda/browser:nightly
    container_name: "moneyprinterturbo-lightpanda"
    command:
      - "/bin/lightpanda"
      - "serve"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "9222"
      - "--obey-robots"
      - "--log-level"
      - "info"
    networks:
      - mpt-net
    restart: unless-stopped
    # A browser renders one page at a time here and holds no models.
    deploy:
      resources:
        limits:
          memory: 1G

  searxng:
    # Meta search over DuckDuckGo, Brave, Wikipedia and friends. Running our
    # own means research queries are not rate-limited by any single engine and
    # no API key or paid search vendor is involved.
    image: searxng/searxng:latest
    container_name: "moneyprinterturbo-searxng"
    networks:
      - mpt-net
    environment:
      SEARXNG_BASE_URL: "http://searxng:8080/"
      SEARXNG_SECRET: "${SEARXNG_SECRET:-moneyprinterturbo-local-only}"
    volumes:
      # Not read-only: SearXNG's entrypoint fixes permissions on this
      # directory at startup and fails on a ro mount.
      - ./docker/searxng:/etc/searxng
    restart: unless-stopped

  webui:
    build:
      context: .
      dockerfile: Dockerfile
      args: *build-args
    image: moneyprinterturbo:latest
    container_name: "moneyprinterturbo-webui"
    environment: *service-env
    networks:
      mpt-net:
        # Keep OrbStack's automatic domain valid while Compose replaces this
        # container; otherwise the old address can be reused by another service.
        ipv4_address: 172.30.85.10
    ports:
      - "127.0.0.1:8501:8501"
    command: [ "streamlit", "run", "./webui/Main.py", "--server.address=0.0.0.0", "--server.port=8501", "--browser.serverAddress=127.0.0.1", "--server.enableCORS=True", "--browser.gatherUsageStats=False", "--client.toolbarMode=minimal", "--logger.hideWelcomeMessage=True", "--server.showEmailPrompt=False" ]
    volumes: *common-volumes
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args: *build-args
    image: moneyprinterturbo:latest
    container_name: "moneyprinterturbo-api"
    environment: *service-env
    networks:
      - mpt-net
    ports:
      - "127.0.0.1:8080:8080"
    command: [ "python3", "main.py" ]
    volumes: *common-volumes
    restart: unless-stopped
