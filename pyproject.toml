# Notes:
# 1. pyproject.toml is the single source of direct dependencies.
# 2. uv.lock pins the runtime so machines resolve the same versions.
[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "moneyprinterturbo"
version = "1.3.6"
description = "Generate short videos from prompts, local assets, subtitles, and TTS."
readme = "README-en.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "moviepy==2.2.1",
    "streamlit==1.59.1",
    "streamlit-tour==1.1.0",
    "edge-tts==7.2.7",
    # Coqui XTTS is *intentionally* not pinned here. The Coqui package
    # brings torch + gruut language packs and balloons any docker build
    # by ~30 minutes; the omnivoice pipeline does not need it. Install
    # it on demand with ``uv pip install TTS`` the first time a
    # ``coqui:`` voice is selected.
    "fastapi==0.136.3",
    "uvicorn==0.32.1",
    "openai==2.24.0",
    "faster-whisper==1.1.0",
    "loguru==0.7.3",
    "dashscope==1.20.14",
    "redis==5.2.0",
    "python-multipart==0.0.27",
    "pyyaml==6.0.3",
    "requests==2.33.1",
    # CDP client for the Lightpanda headless browser used by topic research.
    "websockets==16.0",
    "packaging==24.2",
    "socksio==1.0.0",
    "pydub==0.25.1",
    "audioop-lts==0.2.2; python_version >= '3.13'",
    "litellm==1.86.2",
    "google-genai==2.11.0",
]

[project.optional-dependencies]
# Optional TwelveLabs (https://twelvelabs.io) video-understanding/embedding
# integration. Only needed when `twelvelabs_api_keys` is configured; install
# with `uv sync --extra twelvelabs`.
twelvelabs = [
    "twelvelabs>=1.2.8",
]

[dependency-groups]
dev = [
    "coverage==7.15.1",
    "pytest==9.1.1",
    "ruff==0.15.21",
]

[tool.ruff.lint.per-file-ignores]
# The WebUI adds the project root to sys.path before importing app.
"webui/Main.py" = ["E402"]

[tool.coverage.run]
# Branch coverage finds conditions where a line runs but one branch is untested.
# It is a stronger CI baseline than line coverage alone. Include the CLI, WebUI,
# app services, startup entry points, and agent-facing skill scripts so coverage
# represents the application rather than one isolated module.
branch = true
source = ["app", "cli", "webui", "main", "docs/skill"]

[tool.coverage.report]
# Full Python 3.11 and 3.13 runs exceed 70.4% branch coverage. Keep 70% as a
# stable floor for failure-state, async publishing recovery, and Redis atomic
# update tests while allowing for small platform and Python-version differences.
fail_under = 70
show_missing = true
skip_covered = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
# This project runs as an application, not as an installable Python package.
package = false
