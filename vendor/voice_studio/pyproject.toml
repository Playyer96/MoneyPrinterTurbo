[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voicestudio"
version = "0.5.2"
description = "Minimal, headless VoiceStudio CLI and MCP server for voice cloning and speech synthesis"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = [
    "torch>=2.4",
    "torchaudio>=2.4",
    "transformers>=4.45.0",
    "accelerate",
    "numpy",
    "soundfile",
    "mcp>=1.2.0",
    "pydub",
    "scipy",
    "huggingface_hub",
]

[project.scripts]
voicestudio = "cli:main"
voicestudio-mcp = "mcp_server:main"
