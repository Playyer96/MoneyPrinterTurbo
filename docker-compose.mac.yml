# Apple Silicon override -- puts the GPU behind the normal compose interface.
#
#   docker compose -f docker-compose.yml -f docker-compose.mac.yml up -d --build
#
# MLX has no Linux build and macOS does not pass Metal through to Docker's
# Linux VM, so the model itself cannot run in a container on a Mac -- that is a
# platform limit, not a configuration one. What *can* be containerised is the
# service boundary: the real OmniVoice/MLX server runs natively on the host.
# The Compose provider below provisions and starts it automatically, while a
# tiny socat front door publishes it under the bridge alias `omnivoice`.
#
# The payoff is that nothing above this line changes shape per platform. webui
# and api keep talking to http://omnivoice:8780 exactly as they do on Linux,
# `docker compose ps` lists an omnivoice container, and the healthcheck goes
# red when the host server is down. Only the last hop differs: on Linux it
# lands in a container, on a Mac it lands on Metal.
#
# TTS ~72s -> ~5.5s, whisper ~58s -> ~8.4s versus the CPU container.
#
# The ffmpeg-proxy-host service below adds hardware video encoding on top:
# without it, ffmpeg inside the container has no h264_videotoolbox. The env
# override below turns on the wrapper script (scripts/ffmpeg_mac_wrapper.py)
# for webui and api only -- OmniVoice does not encode video.
#
# service-env-mac duplicates the base compose's *service-env so the YAML
# merge stays self-contained (cross-file anchors do not resolve).
x-service-env-mac: &service-env-mac
  MPT_SKIP_PIPELINE_PREFLIGHT: "1"
  OMNIVOICE_BASE_URL: "${OMNIVOICE_BASE_URL:-http://omnivoice:8780}"
  LIGHTPANDA_URL: "${LIGHTPANDA_URL:-ws://lightpanda:9222}"
  WEB_SEARCH_PROVIDER: "searxng"
  SEARXNG_URL: "${SEARXNG_URL:-http://searxng:8080}"
  FFMPEG_MAC_PROXY_URL: "http://ffmpeg-mac-proxy:8781"

services:
  # Compose invokes this repository-local provider on the Mac host. It caches
  # its isolated Python runtime under .mpt-host and starts Metal/MLX plus
  # VideoToolbox services before either bridge container is created.
  host-accelerators:
    provider:
      type: "${PWD}/scripts/mpt-mac-accelerators"

  # Parked behind a profile rather than scaled to zero: `replicas: 0` still
  # makes `docker compose up` BUILD the 10.8GB torch image, which on a Mac is a
  # long wait for a container that can never reach the GPU. An inactive profile
  # excludes it from both build and start. It stays reachable for a Linux or
  # NVIDIA host with:
  #
  #   docker compose --profile container-tts build omnivoice
  omnivoice:
    profiles: ["container-tts"]

  # Front door for the host GPU server. socat is a ~5MB image doing one TCP
  # forward; all model work happens on the host, on Metal.
  omnivoice-host:
    image: alpine/socat
    container_name: "moneyprinterturbo-omnivoice-host"
    command: "TCP-LISTEN:8780,fork,reuseaddr TCP:host.docker.internal:8780"
    networks:
      mpt-net:
        aliases:
          - omnivoice
    healthcheck:
      test: ["CMD", "nc", "-z", "-w2", "host.docker.internal", "8780"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    depends_on:
      - host-accelerators

  # Front door for the host ffmpeg proxy (scripts/ffmpeg_mac_proxy.py). Same
  # pattern as omnivoice-host: a 5MB socat that forwards a container port
  # to a LaunchAgent on the host. Without this the app inside the container
  # sees ffmpeg from Ubuntu apt, which is built without h264_videotoolbox.
  ffmpeg-proxy-host:
    image: alpine/socat
    container_name: "moneyprinterturbo-ffmpeg-proxy-host"
    command: "TCP-LISTEN:8781,fork,reuseaddr TCP:host.docker.internal:8781"
    networks:
      mpt-net:
        aliases:
          - ffmpeg-mac-proxy
    healthcheck:
      test: ["CMD", "nc", "-z", "-w2", "host.docker.internal", "8781"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    depends_on:
      - host-accelerators

  # The webui and api services inherit env vars from the base file; on Mac
  # we replace them with *service-env-mac, which is the base vars plus
  # FFMPEG_MAC_PROXY_URL. Docker compose does not merge dict-style
  # environment: blocks across files, so the explicit override is required.
  webui:
    environment: *service-env-mac
    depends_on:
      omnivoice-host:
        condition: service_healthy
      ffmpeg-proxy-host:
        condition: service_healthy
  api:
    environment: *service-env-mac
    depends_on:
      omnivoice-host:
        condition: service_healthy
      ffmpeg-proxy-host:
        condition: service_healthy
