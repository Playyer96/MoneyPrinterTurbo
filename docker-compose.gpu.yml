# NVIDIA override. Attaches the GPU to every service that runs a model.
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#
# Only needed because Docker cannot probe for a device driver: asking for the
# nvidia driver on a host without it is a hard startup failure, so it cannot
# live in the base file. The images themselves need no NVIDIA-specific build
# -- torch's default wheel already carries CUDA and activates it when a GPU
# is visible, and whisper's device is "auto".
#
# Prerequisites:
#   1. NVIDIA GPU driver on the host
#   2. NVIDIA Container Toolkit
#   3. Verify with: docker info | grep -i nvidia
x-nvidia: &nvidia
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  # OmniVoice: torch picks up the GPU through torch.cuda.
  voicestudio: *nvidia

  # Video generation runs in whichever process the request lands on, and
  # faster-whisper's "auto" device needs the GPU visible here too.
  webui:
    build:
      dockerfile: Dockerfile.gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  api:
    build:
      dockerfile: Dockerfile.gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
