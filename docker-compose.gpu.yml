# GPU override file
# Usage: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Prerequisites:
#   1. NVIDIA GPU driver installed on host
#   2. NVIDIA Container Toolkit installed
#   3. Verify with: docker info | grep nvidia
#
# This file overrides the default docker-compose.yml to:
#   - Build with Dockerfile.gpu (NVIDIA CUDA base image)
#   - Attach GPU devices to both services because video generation can run in
#     either the WebUI process or the API process
services:
  webui:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  api:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # The TTS server too, when running the container-tts profile on an NVIDIA
  # host. Without this the voicestudio container installs CPU-only torch and
  # stays on the CPU even though the GPU is right there.
  #   docker compose -f docker-compose.yml -f docker-compose.gpu.yml \
  #     --profile container-tts up -d
  voicestudio:
    build:
      args:
        PYTORCH_INDEX_URL: https://download.pytorch.org/whl/cu124
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
