# NVIDIA override. Attaches the GPU to every service that runs a model.
#
#   Linux / macOS shell:
#     docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#   Windows PowerShell or cmd (same command, one line):
#     docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#
# Only needed because Docker cannot probe for a device driver: asking for the
# nvidia driver on a host without it is a hard startup failure, so it cannot
# live in the base file. voicestudio needs no NVIDIA-specific build -- torch's
# default wheel already carries CUDA and activates it when a GPU is visible.
#
# Prerequisites:
#   1. NVIDIA GPU driver on the host
#      (on Windows: the normal Windows driver, NOT a driver inside WSL)
#   2. Linux: NVIDIA Container Toolkit. Windows: Docker Desktop on the WSL2
#      backend, which ships the toolkit already.
#   3. Verify with: docker info | grep -i nvidia
#      Windows PowerShell: docker info | Select-String nvidia
#   4. Smoke test the GPU is visible to containers:
#      docker run --rm --gpus all nvidia/cuda:12.4.1-base-ubuntu22.04 nvidia-smi
#
# `video` is requested alongside `gpu` so the driver mounts libnvidia-encode
# (and libnvidia-ffmpeg): without it ffmpeg's h264_nvenc encoder fails with
# "Cannot load libnvidia-encode.so.1" while the ML models still load fine.
x-nvidia: &nvidia
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu, video]

# webui and api run video generation in-process, and faster-whisper's "auto"
# device needs the GPU visible here too -- so they swap the slim CPU image for
# the CUDA one. The tag differs from the base file's moneyprinterturbo:latest
# on purpose: same tag for two different Dockerfiles means whichever stack was
# built last silently wins for both.
x-app-gpu: &app-gpu
  <<: *nvidia
  build:
    dockerfile: Dockerfile.gpu
  image: moneyprinterturbo:gpu

services:
  # OmniVoice: torch picks up the GPU through torch.cuda.
  voicestudio: *nvidia

  webui: *app-gpu
  api: *app-gpu
